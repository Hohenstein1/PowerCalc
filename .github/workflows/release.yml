name: Linux Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect version
        id: version
        shell: bash
        run: |
          if [[ ! -f src/powercalc.cpp ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/.*kVersion = "\([^"]*\)".*/\1/p' src/powercalc.cpp | head -n1)
          if [[ -z "$version" ]]; then
            echo "Version not found" >&2
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check release
        if: steps.version.outputs.ready == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Linux x86_64
        if: steps.version.outputs.ready == 'true' && steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          make clean
          make STATIC=1
          strip powercalc
          ./powercalc --version
          make check STATIC=1
          file powercalc | grep -q "statically linked"

      - name: Package release
        if: steps.version.outputs.ready == 'true' && steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          package="powercalc-${VERSION}-linux-x86_64"
          mkdir -p "dist/$package"
          cp powercalc README.md LICENSE "dist/$package/"
          tar -C dist -czf "dist/${package}.tar.gz" "$package"
          (cd dist && sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256")

      - name: Create GitHub release
        if: steps.version.outputs.ready == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" \
            "dist/powercalc-${VERSION}-linux-x86_64.tar.gz" \
            "dist/powercalc-${VERSION}-linux-x86_64.tar.gz.sha256" \
            --target "$GITHUB_SHA" \
            --title "PowerCalc ${VERSION}" \
            --notes-file RELEASE_NOTES.md
