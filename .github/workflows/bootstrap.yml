name: Bootstrap PowerCalc 0.3.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          mkdir -p src
          cat .bootstrap/pc.* | base64 --decode > src/powercalc.cpp
          test "$(git hash-object src/powercalc.cpp)" = "888ac446d930394b1000f70378e28e944e210e2a"
          echo "Source hash verified: $(git hash-object src/powercalc.cpp)"

      - name: Build and test
        shell: bash
        run: |
          make clean
          make
          make check
          make clean
          make STATIC=1
          strip powercalc
          ./powercalc --version
          make check STATIC=1
          file powercalc
          ldd powercalc 2>&1 | grep -q "not a dynamic executable"

      - name: Finalize repository
        shell: bash
        run: |
          rm -rf .bootstrap .github/workflows/bootstrap.yml
          rm -f .release-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish PowerCalc 0.3.0"
          git push origin HEAD:main

      - name: Package Linux x86_64
        shell: bash
        run: |
          package="powercalc-0.3.0-linux-x86_64"
          mkdir -p "dist/$package"
          cp powercalc README.md LICENSE "dist/$package/"
          tar -C dist -czf "dist/${package}.tar.gz" "$package"
          (cd dist && sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256")

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v0.3.0" \
            "dist/powercalc-0.3.0-linux-x86_64.tar.gz" \
            "dist/powercalc-0.3.0-linux-x86_64.tar.gz.sha256" \
            --target "$(git rev-parse HEAD)" \
            --title "PowerCalc 0.3.0" \
            --notes-file RELEASE_NOTES.md
