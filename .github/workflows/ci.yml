name: Linux CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          mkdir -p src
          cat .bootstrap/pc.* | base64 --decode > src/powercalc.cpp
          test "$(git hash-object src/powercalc.cpp)" = "888ac446d930394b1000f70378e28e944e210e2a"

      - name: Build and smoke test
        shell: bash
        run: |
          make clean
          make
          make check

      - name: Static Linux x86_64 build
        shell: bash
        run: |
          make clean
          make STATIC=1
          strip powercalc
          ./powercalc --version
          make check STATIC=1
          file powercalc
          file powercalc | grep -q "statically linked"
